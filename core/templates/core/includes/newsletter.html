{% load static %}
<section class="article-newsletter-cta" aria-labelledby="nl-title">
  <div class="nl-icon">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
      <polyline points="22,6 12,13 2,6" />
    </svg>
  </div>
  <div class="nl-content">
    <h3 id="nl-title">Cet article vous a plu ?</h3>
    <p>Abonnez-vous à la newsletter et recevez nos meilleurs contenus directement dans votre boîte mail.</p>
    <form action="{% url 'newsletter_subscribe' %}" method="post" class="nl-form" novalidate>
      {% csrf_token %}
      <label for="nl-email-input" class="visually-hidden">Adresse email</label>
      <input id="nl-email-input" name="email" type="email" placeholder="Votre adresse email" required
        aria-label="Adresse email">
      <button type="submit" class="nl-btn">
        S'abonner
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5l7 7-7 7" />
        </svg>
      </button>
    </form>
  </div>
</section>
